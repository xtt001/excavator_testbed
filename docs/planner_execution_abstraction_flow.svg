<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Primitive Planner Execution and Decision Backend Abstraction</title>
  <desc id="desc">Flow diagram showing the proposed abstraction layers for primitive planner execution, capability facts, decision backends, effects, and public outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243142"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5c86"/>
    </marker>
    <style>
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 28px; font-weight: 700; fill: #18212f; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 15px; fill: #526172; }
      .lane-title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; fill: #18212f; }
      .box-title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 15px; font-weight: 700; fill: #172033; }
      .box-text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 13px; fill: #334155; }
      .small { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 12px; fill: #475569; }
      .note { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; fill: #6b3f00; }
      .shell { fill: #f7fafc; stroke: #9aa8b6; stroke-width: 1.5; rx: 8; }
      .kernel { fill: #e9f4fb; stroke: #2f7ea8; stroke-width: 2; rx: 8; }
      .step { fill: #ffffff; stroke: #7aa7c2; stroke-width: 1.4; rx: 7; }
      .cap { fill: #f1f7ee; stroke: #5f8d54; stroke-width: 1.6; rx: 8; }
      .backend { fill: #fff7e6; stroke: #c78319; stroke-width: 1.6; rx: 8; }
      .effect { fill: #fceeee; stroke: #ba5f5f; stroke-width: 1.6; rx: 8; }
      .output { fill: #f2f0ff; stroke: #7565b8; stroke-width: 1.6; rx: 8; }
      .line { stroke: #243142; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #1d5c86; stroke-width: 2.2; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #62748a; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="60" y="56" class="title">Primitive Planner 抽象方向：先抽执行逻辑，再替换决策后端</text>
  <text x="60" y="82" class="subtitle">核心约束：外部只看 Policy 接口；后端只读事实、返回 effects；只有执行内核能改 planner 状态和分发低层 ACT 动作。</text>

  <rect x="50" y="125" width="215" height="620" class="shell"/>
  <text x="75" y="160" class="lane-title">外部层</text>
  <rect x="78" y="190" width="158" height="84" class="output"/>
  <text x="95" y="218" class="box-title">Eval / Rollout</text>
  <text x="95" y="242" class="box-text">调用 policy.predict(obs)</text>
  <text x="95" y="263" class="box-text">记录 debug / summary</text>

  <rect x="78" y="330" width="158" height="122" class="output"/>
  <text x="95" y="358" class="box-title">公开 Policy API</text>
  <text x="95" y="382" class="box-text">reset()</text>
  <text x="95" y="403" class="box-text">predict(obs)</text>
  <text x="95" y="424" class="box-text">debug_state()</text>
  <text x="95" y="445" class="box-text">rollout_summary()</text>

  <rect x="310" y="125" width="355" height="620" class="kernel"/>
  <text x="338" y="160" class="lane-title">PrimitivePlannerExecutionBase</text>
  <text x="338" y="184" class="subtitle">抽象执行内核：保留行为副作用与公共兼容面</text>

  <rect x="345" y="215" width="285" height="58" class="step"/>
  <text x="365" y="239" class="box-title">1. prepare_tick(obs)</text>
  <text x="365" y="260" class="box-text">boundary event / dig progress / tick state</text>

  <rect x="345" y="305" width="285" height="58" class="step"/>
  <text x="365" y="329" class="box-title">2. decide_tick(context)</text>
  <text x="365" y="350" class="box-text">唯一可替换的决策槽位</text>

  <rect x="345" y="395" width="285" height="72" class="step"/>
  <text x="365" y="419" class="box-title">3. apply_effects(result)</text>
  <text x="365" y="440" class="box-text">set_skill / counters / coverage</text>
  <text x="365" y="459" class="box-text">plans / reset timing / diagnostics</text>

  <rect x="345" y="500" width="285" height="72" class="step"/>
  <text x="365" y="524" class="box-title">4. dispatch_action(obs)</text>
  <text x="365" y="545" class="box-text">scripted bootstrap / pre-dig action</text>
  <text x="365" y="564" class="box-text">or token assembly + ACT policy</text>

  <rect x="345" y="605" width="285" height="58" class="step"/>
  <text x="365" y="629" class="box-title">5. finalize_tick(action)</text>
  <text x="365" y="650" class="box-text">prev_action / debug state / return action</text>

  <rect x="710" y="125" width="250" height="620" class="cap"/>
  <text x="735" y="160" class="lane-title">Capability Port</text>
  <text x="735" y="184" class="subtitle">只读事实接口，不直接产生副作用</text>

  <rect x="742" y="215" width="186" height="88" class="step"/>
  <text x="760" y="239" class="box-title">观测与指标</text>
  <text x="760" y="260" class="box-text">mass / deposit / geometry</text>
  <text x="760" y="281" class="box-text">surface depth / qpos facts</text>

  <rect x="742" y="330" width="186" height="88" class="step"/>
  <text x="760" y="354" class="box-title">门控状态</text>
  <text x="760" y="375" class="box-text">pre-dig / dig / carry</text>
  <text x="760" y="396" class="box-text">dump / return handoff</text>

  <rect x="742" y="445" width="186" height="88" class="step"/>
  <text x="760" y="469" class="box-title">规划状态</text>
  <text x="760" y="490" class="box-text">coverage corridors</text>
  <text x="760" y="511" class="box-text">return envelope / pending dig</text>

  <rect x="742" y="560" width="186" height="88" class="step"/>
  <text x="760" y="584" class="box-title">Token 状态</text>
  <text x="760" y="605" class="box-text">goal / cell / dig cut</text>
  <text x="760" y="626" class="box-text">depth / return tokens</text>

  <rect x="1005" y="125" width="225" height="420" class="backend"/>
  <text x="1028" y="160" class="lane-title">Decision Backends</text>
  <text x="1028" y="184" class="subtitle">隐藏状态机 / 行为树 / VLM 细节</text>

  <rect x="1035" y="215" width="165" height="54" class="step"/>
  <text x="1052" y="239" class="box-title">Legacy FSM</text>
  <text x="1052" y="260" class="box-text">先复刻 baseline 分支顺序</text>

  <rect x="1035" y="295" width="165" height="54" class="step"/>
  <text x="1052" y="319" class="box-title">Behavior Tree</text>
  <text x="1052" y="340" class="box-text">节点读取同一 facts</text>

  <rect x="1035" y="375" width="165" height="54" class="step"/>
  <text x="1052" y="399" class="box-title">VLM / LLM</text>
  <text x="1052" y="420" class="box-text">结构化 decision packet</text>

  <rect x="1035" y="455" width="165" height="54" class="step"/>
  <text x="1052" y="479" class="box-title">Future Scheduler</text>
  <text x="1052" y="500" class="box-text">学习策略 / rule table</text>

  <rect x="1005" y="590" width="225" height="155" class="effect"/>
  <text x="1028" y="623" class="lane-title">DecisionResult</text>
  <text x="1028" y="650" class="box-text">node_path / status / reason</text>
  <text x="1028" y="675" class="box-text">ordered PlannerEffect tuple</text>
  <text x="1028" y="700" class="box-text">diagnostics</text>
  <text x="1028" y="728" class="note">后端返回请求，不直接 mutation</text>

  <rect x="320" y="790" width="600" height="68" class="output"/>
  <text x="348" y="818" class="box-title">稳定输出与兼容面</text>
  <text x="348" y="842" class="box-text">action + debug_state + rollout_summary + planner_trace；外层不感知 backend 实现。</text>

  <path d="M 236 232 C 268 232 285 232 345 244" class="line"/>
  <path d="M 236 391 C 270 391 290 391 345 244" class="line"/>
  <path d="M 488 273 L 488 305" class="blue-line"/>
  <path d="M 488 363 L 488 395" class="blue-line"/>
  <path d="M 488 467 L 488 500" class="blue-line"/>
  <path d="M 488 572 L 488 605" class="blue-line"/>
  <path d="M 488 663 C 488 720 540 750 620 790" class="line"/>

  <path d="M 630 334 C 675 334 690 334 742 374" class="dash"/>
  <path d="M 630 334 C 760 250 885 245 1035 242" class="blue-line"/>
  <path d="M 928 374 C 958 340 980 320 1035 322" class="dash"/>
  <path d="M 928 489 C 955 455 982 410 1035 402" class="dash"/>
  <path d="M 928 604 C 958 570 980 500 1035 482" class="dash"/>
  <path d="M 1117 545 L 1117 590" class="blue-line"/>
  <path d="M 1005 667 C 835 667 750 445 630 431" class="line"/>
  <path d="M 630 536 C 685 620 760 772 920 824" class="line"/>

  <rect x="58" y="790" width="205" height="68" fill="#fffaf0" stroke="#d19a30" stroke-width="1.3" rx="8"/>
  <text x="80" y="818" class="box-title">迁移顺序</text>
  <text x="80" y="842" class="box-text">执行模板先行；backend 后置。</text>

  <rect x="958" y="790" width="272" height="68" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" rx="8"/>
  <text x="980" y="818" class="box-title">禁止方向</text>
  <text x="980" y="842" class="box-text">不要让后端继承巨型 planner 或直接写 self。</text>
</svg>
