<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Primitive planner current runtime architecture</title>
  <desc id="desc">A layered diagram showing PrimitivePlannerACTPolicy delegating to public runtime, execution driver, decision runtime, legacy FSM backend, requested effects, state owners, action dispatch, and reporting.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .laneLabel { font: 700 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; fill: #334155; }
      .boxTitle { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thinArrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .noteText { font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="72" y="70">Current Runtime Architecture</text>
  <text class="subtitle" x="72" y="104">Production path: legacy_fsm is backendified through generic contracts, focused services, and ordered effects.</text>

  <rect x="62" y="145" width="260" height="620" rx="8" fill="#dbeafe" opacity="0.45"/>
  <rect x="350" y="145" width="300" height="620" rx="8" fill="#ccfbf1" opacity="0.45"/>
  <rect x="678" y="145" width="330" height="620" rx="8" fill="#ede9fe" opacity="0.45"/>
  <rect x="1036" y="145" width="260" height="620" rx="8" fill="#ffedd5" opacity="0.5"/>
  <rect x="1324" y="145" width="220" height="620" rx="8" fill="#dcfce7" opacity="0.5"/>

  <text class="laneLabel" x="88" y="175">PUBLIC SHELL</text>
  <text class="laneLabel" x="376" y="175">EXECUTION</text>
  <text class="laneLabel" x="704" y="175">DECISION</text>
  <text class="laneLabel" x="1062" y="175">EFFECTS + STATE</text>
  <text class="laneLabel" x="1350" y="175">OUTPUTS</text>

  <g filter="url(#softShadow)">
    <rect x="92" y="220" width="200" height="84" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text class="boxTitle" x="116" y="250">Eval / rollout</text>
    <text class="boxText" x="116" y="275">external callers</text>

    <rect x="92" y="370" width="200" height="104" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text class="boxTitle" x="116" y="402">PrimitivePlanner</text>
    <text class="boxTitle" x="116" y="426">ACTPolicy</text>
    <text class="boxText" x="116" y="454">public API shell</text>

    <rect x="92" y="555" width="200" height="96" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text class="boxTitle" x="116" y="588">Config adapter</text>
    <text class="boxText" x="116" y="615">constructor and</text>
    <text class="boxText" x="116" y="636">compat normalization</text>

    <rect x="386" y="220" width="228" height="92" rx="8" fill="#ffffff" stroke="#2dd4bf" stroke-width="2"/>
    <text class="boxTitle" x="412" y="254">Public runtime</text>
    <text class="boxText" x="412" y="280">reset / predict / reports</text>

    <rect x="386" y="370" width="228" height="96" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
    <text class="boxTitle" x="412" y="404">Runtime kernel</text>
    <text class="boxText" x="412" y="430">public route owner</text>

    <rect x="386" y="555" width="228" height="104" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <text class="boxTitle" x="412" y="589">Execution driver</text>
    <text class="boxText" x="412" y="616">one-tick ordering</text>
    <text class="boxText" x="412" y="638">boundary + dispatch</text>

    <rect x="704" y="220" width="270" height="90" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text class="boxTitle" x="730" y="252">Decision runtime</text>
    <text class="boxText" x="730" y="278">factory selection</text>

    <rect x="704" y="364" width="270" height="106" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text class="boxTitle" x="730" y="398">Backend input</text>
    <text class="boxText" x="730" y="424">context + lazy facts</text>
    <text class="boxText" x="730" y="446">bootstrap/dig/carry/dump/return</text>

    <rect x="704" y="540" width="270" height="116" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text class="boxTitle" x="730" y="574">legacy_fsm backend</text>
    <text class="boxText" x="730" y="600">default production backend</text>
    <text class="boxText" x="730" y="622">chooses and explains</text>

    <rect x="1066" y="266" width="200" height="96" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text class="boxTitle" x="1090" y="299">Decision result</text>
    <text class="boxText" x="1090" y="325">ordered requested</text>
    <text class="boxText" x="1090" y="346">effects</text>

    <rect x="1066" y="432" width="200" height="106" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <text class="boxTitle" x="1090" y="466">Effect runtime</text>
    <text class="boxText" x="1090" y="492">validate and apply</text>
    <text class="boxText" x="1090" y="514">focused mutations</text>

    <rect x="1066" y="610" width="200" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text class="boxTitle" x="1090" y="644">State owners</text>
    <text class="boxText" x="1090" y="670">execution / cycle</text>
    <text class="boxText" x="1090" y="692">return / coverage / token</text>

    <rect x="1352" y="248" width="158" height="104" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text class="boxTitle" x="1372" y="282">ACT action</text>
    <text class="boxText" x="1372" y="309">dig / carry</text>
    <text class="boxText" x="1372" y="330">dump / return</text>

    <rect x="1352" y="450" width="158" height="116" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text class="boxTitle" x="1372" y="484">Reports</text>
    <text class="boxText" x="1372" y="510">debug_state</text>
    <text class="boxText" x="1372" y="532">summary</text>
    <text class="boxText" x="1372" y="554">planner_trace</text>
  </g>

  <path class="arrow" d="M 192 304 L 192 360"/>
  <path class="arrow" d="M 292 422 L 376 422"/>
  <path class="thinArrow" d="M 192 474 L 192 544"/>
  <path class="arrow" d="M 500 312 L 500 360"/>
  <path class="arrow" d="M 500 466 L 500 544"/>
  <path class="arrow" d="M 614 607 L 690 607"/>
  <path class="arrow" d="M 839 310 L 839 354"/>
  <path class="arrow" d="M 839 470 L 839 530"/>
  <path class="arrow" d="M 974 598 C 1010 598, 1022 314, 1056 314"/>
  <path class="arrow" d="M 1166 362 L 1166 422"/>
  <path class="arrow" d="M 1166 538 L 1166 600"/>
  <path class="arrow" d="M 1266 484 C 1308 484, 1308 300, 1342 300"/>
  <path class="thinArrow" d="M 1266 660 C 1320 660, 1320 508, 1342 508"/>
  <path class="thinArrow" d="M 614 418 C 662 418, 662 265, 692 265"/>

  <rect x="72" y="795" width="1456" height="56" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="noteText" x="96" y="829">Talk track: read-only facts go into the backend; ordered requested effects come out; focused owners mutate; ACT policies still generate continuous control.</text>
</svg>
