# Teleop recording config (V2.1 Stage-1) — multicycle raw teleop.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0
  reset_terrain: true
  reset_pose: true

teleop:
  input: "joystick"
  num_episodes: 20
  stop_mode: "target_dump_count"
  target_dump_count: 3
  stop_on_success: false
  post_success_tail_steps: 50  # keep ~1s after terminal dump_end so the final cycle has post-step observations
  metadata:
    operator_id: ""
    session_id: ""
    notes: ""

  joystick:
    joystick_id: 0
    joystick_ids: [1, 0, 1, 0]
    # FarmStick default aligned to the real excavator:
    # swing <- left stick front/back, stick <- left stick left/right,
    # boom <- right stick front/back, bucket <- right stick left/right (reversed).
    axis_map: [1, 1, 0, 0]
    invert: [false, false, false, true]
    reset_button: 10
    deadzone: 0.05
    scale: [0.6, 0.3, 0.7, 0.7]
    clip: 1.0
    response_profile:
      enabled: true
      use_measured_dt: false
      deadzone: [0.05, 0.05, 0.05, 0.05]
      attack_rate: 4.0
      release_rate: 6.0
      recenter_rate: 7.0
      exponent: 1.0

  keyboard:
    key_speed: 0.5
    window_title: "Testbed Teleop"

task:
  task_name: "agx_excavation_teleop"
  dataset_dir: "data/agx_teleop_v2_1_multi_raw"
  camera_names: ["fpv"]
  max_steps: 4000
  control_hz: 50
  dt: 0.02
  seed: -1
  param_version: "v2_1_stage1"
  scenario_id: "s0_truck"
  recording_mode: "teleop_multi_raw"

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 300.0
  residual_bucket_mass_thresh: 100.0
  hold_steps: 25

reward:
  load_mass_threshold_kg: 100.0
  target_approach_distance_m: 1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m: 0.20
  unsafe_distance_penalty: 0.25
  hard_collision_penalty: 0.75
  spill_penalty: 0.25

action_semantics: "actuator_speed_cmd"
