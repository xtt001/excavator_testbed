# ACT training config for AGX Unity teleop excavation (V0)
# Load with: yaml.safe_load(open("act_agx_v0.yaml"))

task:
  task_name: agx_excavation_teleop
  equipment_model: agxunity
  dataset_dir: data/agx_teleop
  num_episodes: 20
  episode_len: 1000
  camera_names:
    - fpv
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 500
  batch_size: 8
  seed: 0
  device: cuda
  # HDF5 per-sample open + multi-worker loading causes visible jitter here.
  # Start with 0 workers, then benchmark before scaling it up.
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  # Freeze the split per run by saving it under ckpt_dir.
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  # split_path defaults to <ckpt_dir>/train_val_split.yaml when omitted.
  # Lower validation / checkpoint cadence improves wall-clock throughput.
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 100
  plot_every: 100
  # AMP is opt-in at config level so experiments can record the exact dtype.
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/agx_excavation_act_v0
  # To resume training, uncomment the two lines below and set the correct epoch:
  # resume_ckpt: runs/ckpts/agx_excavation_act_v0/policy_epoch_400_seed_0.ckpt
  # start_epoch: 400

eval:
  ckpt_dir: runs/ckpts/agx_excavation_act_v0
  ckpt_path: runs/ckpts/agx_excavation_act_v0/policy_best.ckpt
  num_rollouts: 10
  save_video: true
  video_dir: runs/eval/agx_excavation_act_v0/videos
  results_dir: runs/eval/agx_excavation_act_v0/results
