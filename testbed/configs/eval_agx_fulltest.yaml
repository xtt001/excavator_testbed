# Eval config for the first fulltest ACT baseline on data/agx_teleop_fulltest.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"

eval:
  num_rollouts: 10
  save_video: true
  video_dir: "runs/eval/agx_excavation_act_fulltest/videos"
  results_dir: "runs/eval/agx_excavation_act_fulltest/results"
  save_rollout_logs: true
  rollout_log_dir: "runs/eval/agx_excavation_act_fulltest/results/rollouts"
  step_log_interval: 50
  ckpt_dir: "runs/ckpts/agx_excavation_act_fulltest"

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 300.0
  hold_steps: 25
  residual_bucket_mass_thresh: 100.0
  strict_max_failures:
    hard_target_collision: 0
    spill_before_target: 0

reward:
  load_mass_threshold_kg:       100.0
  target_approach_distance_m:   1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m:   0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m:            0.20
  unsafe_distance_penalty:      0.25
  hard_collision_penalty:       0.75
  spill_penalty:                0.25

policy:
  name: "act"
  ckpt_path: "runs/ckpts/agx_excavation_act_fulltest/policy_best.ckpt"
  temporal_agg: false
  device: "cuda"
