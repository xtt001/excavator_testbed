# Teleop recording config (V1) — AGX excavator joystick demos
# Purpose: rerecord a cleaner dataset without overwriting teleop_v0 defaults.
# This config only uses fields supported by the current recorder/reward path.

# ── AGX connection ────────────────────────────────────────────────────────────
agx:
  host:    "127.0.0.1"
  port:    5057
  timeout: 10.0
  reset_terrain: true
  reset_pose:    true

# ── Teleop device ────────────────────────────────────────────────────────────
teleop:
  input:         "joystick"
  num_episodes:  30
  stop_on_success: true
  post_success_tail_steps: 50   # keep recording for ~1s after success to capture dump settling
  metadata:
    operator_id: ""
    session_id: ""
    notes: ""

  joystick:
    joystick_id: 0
    joystick_ids: [1, 0, 1, 0]
    axis_map:  [0, 1, 1, 0]
    invert:    [false, false, false, false]
    reset_button: 10
    deadzone:  0.05
    scale:     [0.6, 0.3, 0.7, 0.7]
    clip:      1.0
    response_profile:
      enabled: true
      use_measured_dt: false
      deadzone: [0.05, 0.05, 0.05, 0.05]
      attack_rate: 4.0
      release_rate: 6.0
      recenter_rate: 7.0
      exponent: 1.0

  keyboard:
    key_speed:    0.5
    window_title: "Testbed Teleop"

# ── Task / episode parameters ────────────────────────────────────────────────
task:
  task_name:     "agx_excavation_teleop"
  dataset_dir:   "data/agx_teleop_v1"
  camera_names:  ["fpv"]
  # Runtime image resolution comes from Unity GET_INFO camera descriptors and is
  # saved into each episode's metadata as camera_width / camera_height / camera_fps.
  # Keep this fixed across a baseline run.
  max_steps:     1000
  control_hz:    50
  dt:            0.02
  seed:          -1
  param_version: "v1"

# ── Mission reward / success ────────────────────────────────────────────────
success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 300.0
  residual_bucket_mass_thresh: 100.0
  hold_steps:  25

reward:
  load_mass_threshold_kg:       100.0
  target_approach_distance_m:   1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m:   0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m:            0.20
  unsafe_distance_penalty:      0.25
  hard_collision_penalty:       0.75
  spill_penalty:                0.25

# ── Action semantics (locked for V0/V1 teleop path) ─────────────────────────
action_semantics: "actuator_speed_cmd"
