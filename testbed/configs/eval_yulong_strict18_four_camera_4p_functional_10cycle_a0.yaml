# Strict-18 A0 functional-regression gate. This is intentionally independent
# from act_unity_closed_loop_validation_v1 and cannot freeze ACT or unlock the
# effect-model route. Use a fresh --output-dir for every repeat.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"
  equipment_model: "yulong"
  episode_len: 24000
  scenario_id: "s0_truck"
  camera_names:
    - stick_up
    - stick_down
    - eye_left
    - eye_right

eval:
  num_rollouts: 1
  no_overwrite: true
  save_video: true
  video_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_strict18_terrain_residual_v0/functional_10cycle_a0_wall_safe_1x10_v1/videos"
  results_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_strict18_terrain_residual_v0/functional_10cycle_a0_wall_safe_1x10_v1/results"
  save_rollout_logs: true
  stream_rollout_logs: true
  rollout_log_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_strict18_terrain_residual_v0/functional_10cycle_a0_wall_safe_1x10_v1/results/rollouts"
  record_hdf5: true
  hdf5_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_strict18_terrain_residual_v0/functional_10cycle_a0_wall_safe_1x10_v1/results/hdf5_rollouts"
  record_hdf5_with_cell_entry: true
  record_hdf5_metadata:
    validation_schema: "act_functional_10cycle_validation_v1"
    temporal_variant: "A0"
    planner_safety_variant: "coverage_wall_safety_v1"
    unity_scene_id: "Assets/AGXUnity_Excavator/AGXUnity_Excavator.unity@sha256:97b01deb2229b087f110defef2c117f19c4ad8e16b1ad51d154fe5cc6514b7c9"
    unity_source_sha256: "fb50869beec98876163e98487a7cc7fc3786fdba89cf3dc9f169a9decf9b2092"
    unity_git_commit: "2ef27457999a54090f64e151a73dbafc88ec1670"
    unity_git_branch: "codex/2_4-yulong-factory-replacement"
    unity_git_dirty: 1
  send_planner_debug_to_backend: false
  step_log_interval: 100
  target_cycle_gate: null
  target_cycle_gate_terminal_hold_steps: 0
  temporal_agg: true

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 20.0
  hold_steps: 1
  residual_bucket_mass_thresh: 15.0
  strict_max_failures:
    hard_target_collision: 0
    spill_before_target: 0

reward:
  load_mass_threshold_kg: 55.0
  target_approach_distance_m: 1.25
  deposit_started_threshold_kg: 5.0
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  qualified_dig_start_mode: "contact_depth"
  unsafe_distance_m: 0.20
  unsafe_distance_penalty: 0.25
  hard_collision_penalty: 0.75
  spill_penalty: 0.25

policy:
  class: "primitive_planner_act"
  device: "cuda"
  temporal_agg: true
  primitive_low_dim_keys: ["qpos", "qvel"]
  dig_low_dim_keys: ["qpos", "qvel", "dig_cut_tokens"]
  carry_low_dim_keys: ["qpos", "qvel"]
  dump_low_dim_keys: ["qpos", "qvel"]
  return_low_dim_keys: ["qpos", "qvel", "return_start_envelope_tokens_v1"]
  action_dim: 4

  dig_cut_planner:
    enabled: true
    mode: "operator_prior_sweep_belief"
    prior_path: "testbed/configs/planner_priors/yulong_strict18_train_surface_depth_dig_cut_prior_v1.json"
    fallback_mode: "raise"
    hold_token_until_skill_exit: true
    return_start_envelope:
      use_cell_prior: true
      min_source_count: 20
      min_source_fraction: 0.05
    coverage:
      use_env_removed_depth: true
      entry_x_percentiles: [p10, p50, p90]
      entry_z_percentiles: [p10, p50, p90]
      cut_depth_percentile: p90
      payload_percentile: p90
      cut_length_percentile: p50
      low_productivity_payload_kg: 15.0
      low_productivity_deposit_kg: 15.0
      deplete_after_low_streak: 2
      global_low_productivity_stop: 3
      max_attempts_per_corridor: 3
      unattempted_bonus: 2.0
      attempt_penalty: 0.65
      recent_selection_penalty: 1.25
      recent_row_selection_penalty: 1.50
      belief_gain_scale: 0.55
      belief_depleted_score: 1.0
      first_dig_strategy: nearest_entry
      first_dig_preferred_corridor_id: null
      first_dig_preferred_bonus: 0.0
      first_dig_proximity_weight: 8.0
      first_dig_max_entry_distance_m: 0.45
      first_dig_qpos_delta_weight: 4.0
      first_dig_max_qpos_delta: [0.12, 0.18, 0.20, 0.22]
      candidate_layout: cell_weighted_3x2
      rare_cell_source_fraction_threshold: 0.05
      rare_cell_max_attempts: 1
      cell_confidence_weight: 0.75
      wall_safety:
        enabled: true
        profile: "conservative_2d_worktool_swept_footprint_v1"
        worktool_width_m: 0.70
        hard_clearance_m: 0.30
        soft_clearance_m: 0.45
        max_score_penalty: 1.0
        missing_geometry: "fail_closed"

  return_target_planner:
    enabled: true
    hold_token_until_skill_exit: true
    token_source_prefix: "conditioned_return"

  box_emptying:
    enabled: false
    safety_enabled: true
    carry_start_envelope:
      enabled: true
      artifact_path: "/data/pingfan/excavator_testbed_data/yulong_strict18_terrain_residual_v0/qc/carry_start_envelope_v1.json"
      artifact_sha256: "ab8e13ac8ff4565a9faf13264c96071289b8a92e3ddcf2baaced0918920b621a"
      hold_steps: 3
      max_dig_steps: 500
    functional_cycle_gate:
      enabled: true
      target_cycles: 10
      max_bucket_mass_kg: 15.0
    safety:
      low_payload_kg: 15.0
      wall_high_force_n: 100000.0
      stuck_action_l1_min: 0.10
      stuck_window_steps: 50
      stuck_qpos_max_change: 0.005
      stuck_bucket_tip_max_displacement_m: 0.02
      hard_bottom_clearance_target_qpos: [0.513391, 0.441393, 0.639626, 0.991115]
      hard_bottom_clearance_kp: 2.0
      hard_bottom_clearance_kd: 0.25
      hard_bottom_clearance_action_signs: [1.0, -1.0, 1.0, 1.0]
      hard_bottom_clearance_action_clip: [0.0, 0.35, 0.35, 0.55]
      hard_bottom_clearance_hold_steps: 3
      hard_bottom_clearance_margin_m: 0.02
      hard_bottom_clearance_max_steps: 150
      hard_bottom_depth_increase_abort_m: 0.002

  pre_dig_align:
    enabled: false
    first_dig_only: true

  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
    temporal_agg_window: 100
    temporal_agg_weight_order: "legacy_oldest_first"
    temporal_agg_decay: 0.01
  dig_outcome_head:
    enabled: true
    dim: 10
    action_horizon: 100
    hidden_dim: 512
  return_outcome_head:
    enabled: true
    dim: 10
    action_horizon: 100
    hidden_dim: 512

  bootstrap_end_mode: "scripted_qpos"
  scripted_bootstrap:
    target_qpos: [0.5, 0.4083661, 0.6206904, 0.1711094]
    kp: 2.0
    kd: 0.25
    action_clip: [0.75, 0.35, 0.35, 0.55]
    action_signs: [1.0, -1.0, 1.0, 1.0]
    qpos_tolerance: 0.02
    qvel_abs_max: 0.10
    hold_steps: 5
    max_steps: 240

  dig_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/dig/policy_best.ckpt"
  dig_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/dig"
  carry_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/carry/policy_best.ckpt"
  carry_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/carry"
  dump_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/dump/policy_best.ckpt"
  dump_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/dump"
  return_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/return/policy_best.ckpt"
  return_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_strict18_terrain_residual_v0/return"

  switch:
    dig_to_carry_min_bucket_mass_kg: 15.0
    dig_to_carry_target_bucket_mass_kg: 45.0
    dig_to_carry_min_distance_to_dig_area_m: 0.0
    dig_to_carry_mass_plateau_enabled: true
    dig_to_carry_mass_plateau_min_bucket_mass_kg: 15.0
    dig_to_carry_mass_plateau_epsilon_kg: 1.0
    dig_to_carry_mass_plateau_hold_steps: 25
    dig_to_carry_mass_plateau_min_steps: 160
    dig_bad_replan_enabled: true
    dig_bad_replan_max_steps: 220
    dig_bad_replan_min_bucket_mass_kg: 15.0
    dig_exit_guard_enabled: true
    dig_exit_guard_min_steps: 80
    dig_exit_guard_overshoot_m: 0.65
    dig_exit_guard_min_bucket_mass_kg: 20.0
    dig_failed_replan_next_skill: "dig"
    dump_ready_min_bucket_mass_kg: 15.0
    dump_ready_min_height_above_rim_m: 0.50
    dump_ready_require_over_footprint: true
    dump_ready_require_clearance: false
    dump_ready_position_mode: "footprint_or_dump_area_relative"
    dump_ready_max_dump_area_footprint_outside_distance_m: 0.45
    dump_ready_min_dump_area_relative_x_m: 0.0
    dump_ready_max_dump_area_relative_x_m: 1.2
    dump_ready_min_dump_area_relative_z_m: 1.0
    dump_ready_max_dump_area_relative_z_m: 1.8
    dump_ready_hold_steps: 3
    dump_ready_near_window_enabled: true
    dump_ready_near_window_x_tolerance_m: 0.05
    dump_ready_near_window_z_tolerance_m: 0.05
    dump_ready_near_window_outside_tolerance_m: 0.0
    dump_ready_near_window_require_over_footprint: true
    dump_done_max_bucket_mass_kg: 15.0
    dump_done_min_deposit_delta_kg: 5.0
    dump_done_hold_steps: 1
    dump_done_use_boundary_event: true
    return_to_dig_shallow_guard_enabled: true
    return_to_dig_max_bucket_mass_kg: 15.0
    return_to_dig_touch_tolerance_m: 0.05
    return_to_dig_min_depth_m: 0.02
    return_to_dig_max_depth_m: 0.12
    return_to_dig_max_entry_error_m: 0.65
    return_to_dig_start_envelope_gate_enabled: true
    return_to_dig_start_envelope_spatial_tolerance: 0.10
    return_to_dig_start_envelope_depth_tolerance_m: 0.08
    return_to_dig_start_envelope_local_depth_tolerance_m: 0.005
    return_to_dig_start_envelope_plane_depth_tolerance_m: 0.0
    return_to_dig_start_envelope_plane_depth_mode: "p50_floor"
    return_to_dig_start_envelope_qpos_tolerance: 0.04
    return_to_dig_start_envelope_require_contact: true
    return_max_steps: 420

boundary:
  profile: "v2_4_5_spatial_mass"
  dig_complete_min_bucket_mass_kg: 15.0
  dig_complete_mass_plateau_epsilon_kg: 1.0
  dig_complete_mass_plateau_hold_steps: 8
  dig_complete_departed_distance_m: 0.08
  dig_complete_departed_hold_steps: 3
  dump_committed_min_bucket_mass_kg: 15.0
  dump_committed_min_height_above_rim_m: 0.45
  dump_committed_max_outside_distance_m: 0.45
  dump_committed_min_relative_x_m: -0.4
  dump_committed_max_relative_x_m: 2.1
  dump_committed_min_relative_z_m: 0.3
  dump_committed_max_relative_z_m: 2.3
  dump_committed_require_clearance: false
  dump_committed_hold_steps: 3
  release_onset_min_bucket_mass_drop_kg: 0.5
  release_onset_min_deposit_gain_kg: 0.5
