# AGX backend connection config (V0)
# Used by record_teleop.py, replay.py, eval.py
# ─────────────────────────────────────────────────────────────────────────────

agx:
  host:    "127.0.0.1"   # Unity machine IP — override for remote machine
  port:    5057           # Unity bridge port
  timeout: 10.0           # socket receive timeout (seconds)

  # V0 locked vector dims — must match protocol.py
  action_dim: 4           # [swing, boom, stick, bucket]
  qpos_dim:   4           # [swing, boom, stick, bucket] position_norm
  qvel_dim:   4           # [swing, boom, stick, bucket] speed

  # env_state
  env_state_mass_in_bucket_idx: 0   # index of mass_in_bucket in env_state vector
  env_state_excavated_mass_idx: 1   # cumulative excavated mass in current episode
  env_state_mass_in_target_box_idx: 2
  env_state_deposited_mass_in_target_box_idx: 3
  env_state_min_distance_to_target_idx: 4
  env_state_target_hard_collision_count_idx: 5
  env_state_target_contact_max_normal_force_n_idx: 6
  env_state_min_distance_to_dig_area_idx: 7
  env_state_bucket_depth_below_dig_area_plane_idx: 8
