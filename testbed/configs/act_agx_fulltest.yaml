# ACT baseline config for the current 20-episode AGX fulltest dataset.
# Purpose: first non-smoke baseline on data/agx_teleop_fulltest without
# overwriting the generic v0 and smoke configs.

task:
  task_name: agx_excavation_teleop
  equipment_model: agxunity
  dataset_dir: data/agx_teleop_fulltest
  num_episodes: 20
  episode_len: 1000
  camera_names:
    - fpv
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 500
  # With only 20 demos, batch_size=4 gives more optimizer updates per epoch
  # than the generic v0 batch_size=8 while staying stable on a single GPU.
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/agx_excavation_act_fulltest

eval:
  ckpt_dir: runs/ckpts/agx_excavation_act_fulltest
  ckpt_path: runs/ckpts/agx_excavation_act_fulltest/policy_best.ckpt
  num_rollouts: 10
  save_video: true
  video_dir: runs/eval/agx_excavation_act_fulltest/videos
  results_dir: runs/eval/agx_excavation_act_fulltest/results
