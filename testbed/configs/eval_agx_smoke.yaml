# Eval smoke config for AGX excavation (V0 stationary digging)

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"

eval:
  num_rollouts: 2
  save_video: true
  video_dir: "runs/eval/agx_excavation_smoke"
  results_dir: "runs/eval/agx_excavation_smoke_results"

success:
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 100.0
  hold_steps: 25

reward:
  load_mass_threshold_kg:       100.0
  target_approach_distance_m:   1.25
  deposit_started_threshold_kg: 10.0
  unsafe_distance_m:            0.20
  unsafe_distance_penalty:      0.25
  hard_collision_penalty:       0.75
  spill_penalty:                0.25

policy:
  name: "act"
  ckpt_path: "runs/ckpts/agx_excavation_act_smoke/policy_best.ckpt"
  temporal_agg: false
  device: "cuda"
