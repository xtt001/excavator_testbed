# Current target-safe quality-mix clean_v3 work-skill ACT config.
#
# Dataset composition:
# - 51 old archived clean_v3 cycles after target-safe filtering
# - 23 quality top-up terminal-fix v3 cycles from 2604241251 after target-safe filtering
# - stage5_strict now rejects near_dump_start cycles with dump_start_distance_m < 0.35

task:
  task_name: agx_excavation_teleop
  equipment_model: agxunity
  dataset_dir: data/agx_teleop_v2_1_multi_raw_all_workskill_clean_v3_qualitymix_targetsafe_2604241251_v2_1c
  num_episodes: 0
  episode_len: 1200
  camera_names:
    - fpv
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  low_dim_keys:
    - qpos
    - qvel
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 500
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/agx_excavation_act_v2_1_multi_raw_all_workskill_clean_v3_qualitymix_targetsafe_qvel
