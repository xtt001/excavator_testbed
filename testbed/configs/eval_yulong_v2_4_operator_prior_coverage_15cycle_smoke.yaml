# YuLong V2.4 coverage-planner 15-cycle smoke.
#
# This keeps the V2.2 4-primitive ACT checkpoints and the 10D dig_cut_tokens
# contract unchanged.  Only the live planner chooses a coverage corridor and
# streams the planner decision to Unity for HUD / DigArea visualization.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"
  equipment_model: "yulong"
  episode_len: 12000
  scenario_id: "s0_truck"
  camera_names:
    - fpv

eval:
  num_rollouts: 1
  save_video: true
  video_dir: "runs/eval/yulong_v2_4_operator_prior_coverage_15cycle_smoke_20260519/videos"
  results_dir: "runs/eval/yulong_v2_4_operator_prior_coverage_15cycle_smoke_20260519/results"
  save_rollout_logs: true
  stream_rollout_logs: true
  rollout_log_dir: "runs/eval/yulong_v2_4_operator_prior_coverage_15cycle_smoke_20260519/results/rollouts"
  record_hdf5: false
  record_hdf5_with_cell_entry: false
  step_log_interval: 100
  target_cycle_gate: 15
  target_cycle_gate_terminal_hold_steps: 1
  temporal_agg: true

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 20.0
  hold_steps: 1
  residual_bucket_mass_thresh: 15.0
  strict_max_failures:
    hard_target_collision: 0
    spill_before_target: 0

reward:
  load_mass_threshold_kg: 55.0
  target_approach_distance_m: 1.25
  deposit_started_threshold_kg: 5.0
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  qualified_dig_start_mode: "contact_depth"
  unsafe_distance_m: 0.20
  unsafe_distance_penalty: 0.25
  hard_collision_penalty: 0.75
  spill_penalty: 0.25

policy:
  class: "primitive_planner_act"
  device: "cuda"
  temporal_agg: true
  primitive_low_dim_keys: ["qpos", "qvel"]
  dig_low_dim_keys: ["qpos", "qvel", "dig_cut_tokens"]
  carry_low_dim_keys: ["qpos", "qvel"]
  dump_low_dim_keys: ["qpos", "qvel"]
  return_low_dim_keys: ["qpos", "qvel"]
  action_dim: 4
  dig_cut_planner:
    enabled: true
    mode: "operator_prior_coverage"
    prior_path: "testbed/configs/planner_priors/yulong_removed_depth_dig_cut_prior_v3.json"
    fallback_mode: "conservative_pose"
    hold_token_until_skill_exit: true
    coverage:
      entry_x_percentiles: ["p10", "p50", "p90"]
      entry_z_percentiles: ["p10", "p50", "p90"]
      low_productivity_payload_kg: 15.0
      low_productivity_deposit_kg: 15.0
      deplete_after_low_streak: 2
      min_remaining_depth_m: 0.05
      global_low_productivity_stop: 9
      max_attempts_per_corridor: 3
      unattempted_bonus: 2.0
      attempt_penalty: 0.65
      recent_selection_penalty: 1.25
  pre_dig_align:
    # Diagnostic only. The V2.4 mainline is no-align; next-entry execution
    # should be learned by conditioned return instead of a hand-written align
    # servo.
    enabled: false
    controlled_dims: [1, 1, 1, 1]
    bucket_target_qpos: 0.0
    kp: 2.4
    kd: 0.25
    action_clip: [0.65, 0.45, 0.45, 0.35]
    action_signs: [1.0, -1.0, 1.0, 1.0]
    qpos_tolerance: [0.025, 0.04, 0.05, 0.06]
    qvel_abs_max: 0.15
    hold_steps: 3
    max_steps: 340
    max_entry_error_m: 0.35
    timeout_accept_entry_error_m: 0.45
    timeout_replan_entry_error_m: 0.45
    start_envelope_enabled: true
    start_envelope_max_entry_error_m: 0.65
    start_qpos_min: [0.45, 0.52, 0.0, 0.0]
    start_qpos_max: [0.57, 0.78, 0.40, 0.12]
    start_pose_min: [-0.60, -0.30, -1.50]
    start_pose_max: [1.65, 0.25, 1.20]
    qpos_min: [0.44, 0.50, 0.0, 0.0]
    qpos_max: [0.56, 0.79, 0.42, 0.36]
    qpos_from_token_coefficients:
      - [0.49761536, -0.00324577, -0.07974796]
      - [0.48509995, 0.34124863, -0.02063946]
      - [0.39998216, -0.50266185, 0.04142020]
      - [0.21223230, -0.14153491, -0.01244724]
  act_params:
    chunk_size: 100
    kl_weight: 10
    hidden_dim: 512
    dim_feedforward: 3200

  bootstrap_end_mode: "scripted_qpos"
  scripted_bootstrap:
    target_qpos: [0.5, 0.4083661, 0.6206904, 0.1711094]
    kp: 2.0
    kd: 0.25
    action_clip: [0.75, 0.35, 0.35, 0.55]
    action_signs: [1.0, -1.0, 1.0, 1.0]
    qpos_tolerance: 0.02
    qvel_abs_max: 0.10
    hold_steps: 5
    max_steps: 240

  dig_ckpt_path: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/dig/policy_best.ckpt"
  dig_ckpt_dir: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/dig"
  carry_ckpt_path: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/carry/policy_best.ckpt"
  carry_ckpt_dir: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/carry"
  dump_ckpt_path: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/dump/policy_best.ckpt"
  dump_ckpt_dir: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/dump"
  return_ckpt_path: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/return/policy_best.ckpt"
  return_ckpt_dir: "runs/ckpts/yulong_v2_2_operator_first_4p_500e_20260516/return"

  switch:
    dig_to_carry_min_bucket_mass_kg: 15.0
    dig_to_carry_target_bucket_mass_kg: 45.0
    dig_to_carry_min_distance_to_dig_area_m: 0.0
    dig_to_carry_mass_plateau_enabled: true
    dig_to_carry_mass_plateau_min_bucket_mass_kg: 35.0
    dig_to_carry_mass_plateau_epsilon_kg: 1.0
    dig_to_carry_mass_plateau_hold_steps: 30
    dig_to_carry_mass_plateau_min_steps: 120
    dig_bad_replan_enabled: true
    dig_bad_replan_max_steps: 220
    dig_bad_replan_min_bucket_mass_kg: 35.0
    dig_to_carry_min_distance_to_dig_area_m: 0.0
    dump_ready_min_bucket_mass_kg: 15.0
    dump_ready_min_height_above_rim_m: 0.50
    dump_ready_require_over_footprint: true
    dump_ready_require_clearance: false
    dump_ready_position_mode: "footprint_or_dump_area_relative"
    dump_ready_max_horizontal_distance_m: null
    dump_ready_max_dump_area_footprint_outside_distance_m: 0.45
    dump_ready_min_dump_area_relative_x_m: 0.0
    dump_ready_max_dump_area_relative_x_m: 1.2
    dump_ready_min_dump_area_relative_z_m: 1.0
    dump_ready_max_dump_area_relative_z_m: 1.8
    dump_ready_hold_steps: 3
    dump_ready_near_window_enabled: true
    dump_ready_near_window_x_tolerance_m: 0.05
    dump_ready_near_window_z_tolerance_m: 0.05
    dump_ready_near_window_outside_tolerance_m: 0.0
    dump_ready_near_window_require_over_footprint: true
    dump_done_max_bucket_mass_kg: 15.0
    dump_done_min_deposit_delta_kg: 5.0
    dump_done_hold_steps: 1
    dump_done_use_boundary_event: false
    return_to_dig_shallow_guard_enabled: true
    return_to_dig_max_bucket_mass_kg: 15.0
    return_to_dig_touch_tolerance_m: 0.05
    return_to_dig_min_depth_m: 0.02
    return_to_dig_max_depth_m: 0.12
    return_max_steps: 420
