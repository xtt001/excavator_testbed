# Eval suite config for AGX excavation (V0)
# ─────────────────────────────────────────────────────────────────────────────

# ── AGX connection ────────────────────────────────────────────────────────────
agx:
  host:    "127.0.0.1"
  port:    5057
  timeout: 10.0

# ── Task ─────────────────────────────────────────────────────────────────────
task:
  name: "agx_excavation_teleop"

# ── Eval parameters ───────────────────────────────────────────────────────────
eval:
  num_rollouts:  10         # increase to 50 for final eval
  save_video:    true
  video_dir:     "runs/eval/agx_excavation"
  results_dir:   "runs/eval/agx_excavation/results"
  save_rollout_logs: true
  rollout_log_dir: "runs/eval/agx_excavation/results/rollouts"
  step_log_interval: 50
  ckpt_dir:      "runs/ckpts/agx_excavation_act_v0"

# ── Mission success / reward ─────────────────────────────────────────────────
# success = deposited_mass_in_target_box_kg stays above mass_thresh for hold_steps
success:
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 100.0
  hold_steps:  25

reward:
  load_mass_threshold_kg:       100.0
  target_approach_distance_m:   1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m:   0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m:            0.20
  unsafe_distance_penalty:      0.25
  hard_collision_penalty:       0.75
  spill_penalty:                0.25

# ── Policy ────────────────────────────────────────────────────────────────────
policy:
  name: "act"               # "act" | "dummy"
  ckpt_path: "runs/ckpts/agx_excavation_act_v0/policy_best.ckpt"
  temporal_agg: false
  device: "cuda"
