# Teleop recording config (V0) — AGX excavator joystick demos
# Load with: yaml.safe_load(open("teleop_v0.yaml"))
# ─────────────────────────────────────────────────────────────────────────────

# ── AGX connection ────────────────────────────────────────────────────────────
agx:
  host:    "127.0.0.1"   # replace with Unity machine IP for remote setup
  port:    5057
  timeout: 10.0
  reset_terrain: true    # teleop default: reset terrain for each new episode
  reset_pose:    true    # still return excavator to the baseline pose each episode

# ── Teleop device ────────────────────────────────────────────────────────────
teleop:
  input:         "joystick"     # "joystick" | "keyboard"
  num_episodes:  20
  stop_on_success: true         # stop recording as soon as task_success becomes true
  metadata:
    operator_id: ""
    session_id: ""
    notes: ""

  joystick:
    joystick_id: 0              # fallback for single-device setups
    # Dual-stick FarmStick mapping:
    # action order is [swing, boom, stick, bucket]
    # joystick_ids maps each action axis to a pygame joystick device id.
    # Current setup assumes joystick 0 = right stick, joystick 1 = left stick.
    joystick_ids: [1, 0, 1, 0]
    # axis_map uses pygame's zero-based axis indices.
    # With your FarmStick bring-up this maps:
    # swing <- left stick left/right
    # boom  <- right stick front/back
    # stick <- left stick front/back
    # bucket <- right stick left/right
    axis_map:  [0, 1, 1, 0]
    invert:    [false, false, false, false]
    # Buttons are read on any configured joystick by default.
    # These also use pygame's zero-based button indices.
    # FarmStick manual button 11 is pygame button index 10.
    reset_button: 10
    deadzone:  0.05             # legacy raw-axis deadzone; also used by response_profile by default
    scale:     [0.6, 0.3, 0.7, 0.7]  # match Unity interpreter magnitudes more closely
    clip:      1.0              # hard clip after scale
    response_profile:
      enabled: true             # port of Unity AxisResponseProfile behavior
      use_measured_dt: false    # fixed control-step dt is smoother for synchronous step-ack teleop
      deadzone: [0.05, 0.05, 0.05, 0.05]  # scalar or [4] per-axis
      attack_rate: 4.0          # scalar or [4]
      release_rate: 6.0         # scalar or [4]
      recenter_rate: 7.0        # scalar or [4]
      exponent: 1.0             # scalar or [4]

  keyboard:
    key_speed:    0.5           # speed when key held (0..1)
    window_title: "Testbed Teleop"

# ── Task / episode parameters ────────────────────────────────────────────────
task:
  task_name:     "agx_excavation_teleop"
  dataset_dir:   "data/agx_teleop"
  camera_names:  ["fpv"]
  # Runtime image resolution comes from Unity GET_INFO camera descriptors and is
  # saved into each episode's metadata as camera_width / camera_height / camera_fps.
  # Keep this fixed across a baseline run. High-resolution FPV (e.g. 1920x1060)
  # has already been observed to cause step-ack jitter; prefer the lower
  # fixed resolution that keeps live teleop smooth.
  max_steps:     1000           # 20s @ 50Hz
  control_hz:    50
  dt:            0.02
  seed:          -1             # -1 = time-based seed per episode
  param_version: "v0"

# ── Mission reward / success ────────────────────────────────────────────────
success:
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 100.0
  hold_steps:  25

reward:
  load_mass_threshold_kg:       100.0
  target_approach_distance_m:   1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m:   0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m:            0.20
  unsafe_distance_penalty:      0.25
  hard_collision_penalty:       0.75
  spill_penalty:                0.25

# ── Action semantics (locked for V0) ─────────────────────────────────────────
# action = [swing_speed_cmd, boom_speed_cmd, stick_speed_cmd, bucket_speed_cmd]
# all in [-1, 1] normalized (post-deadzone, post-scale)
action_semantics: "actuator_speed_cmd"
