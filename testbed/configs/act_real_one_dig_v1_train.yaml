# ACT train config for cropped real-machine one-dig windows.
# This is the first longer real-domain run used before offline shadow/eval.

task:
  task_name: real_one_dig_v1
  equipment_model: agxunity
  dataset_dir: data/real_one_dig_v1_windows
  num_episodes: 9
  episode_len: 3400
  camera_names:
    - fpv
  backend:
    name: real
    dt: 0.02

policy:
  class: ACT
  device: cuda
  low_dim_keys:
    - qpos
    - qvel
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 100
  batch_size: 2
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 10
  amp: false
  amp_dtype: auto
  ckpt_dir: runs/ckpts/real_one_dig_v1_train

eval:
  ckpt_dir: runs/ckpts/real_one_dig_v1_train
  ckpt_path: runs/ckpts/real_one_dig_v1_train/policy_best.ckpt
  num_rollouts: 0
  save_video: false
  video_dir: runs/eval/real_one_dig_v1_train/videos
  results_dir: runs/eval/real_one_dig_v1_train/results
