# RQ1 train config — condition: c0_baseline

task:
  task_name: agx_excavation_teleop
  equipment_model: agxunity
  dataset_dir: data/rq1/c0_baseline
  num_episodes: 20
  episode_len: 1000
  camera_names:
    - fpv
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 2000
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/rq1/c0_baseline

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

success:
  mode: dump_complete_final_hold
  mass_thresh: 300.0
  residual_bucket_mass_thresh: 100.0
  hold_steps: 25
