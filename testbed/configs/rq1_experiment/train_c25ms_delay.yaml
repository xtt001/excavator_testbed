# RQ1 Training: 25ms delay condition
task:
  task_name: agx_excavation_teleop
  equipment_model: agxunity
  dataset_dir: data/rq1/c_25ms
  num_episodes: 10
  episode_len: 1000
  camera_names: [fpv]
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 500
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/rq1_act_25ms
