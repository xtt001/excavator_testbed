# YuLong FarmStick 3-cycle replayx20 work-skill ACT pilot config.
#
# Source action teacher:
#   data/yulong_farmstick_3cycle_raw_20260514/episode_0.hdf5
# Regenerated fixed-observation dataset:
#   data/yulong_farmstick_3cycle_replay20_varseed_fixedobs_20260514_1337
# Labeled/cropped training dataset:
#   data/yulong_farmstick_3cycle_replay20_varseed_fixedobs_20260514_1337_v2_1_workskill

task:
  task_name: agx_excavation_teleop
  equipment_model: yulong
  dataset_dir: data/yulong_farmstick_3cycle_replay20_varseed_fixedobs_20260514_1337_v2_1_workskill
  num_episodes: 0
  episode_len: 1200
  camera_names:
    - fpv
  backend:
    name: agx
    dt: 0.02

policy:
  class: ACT
  device: cuda
  low_dim_keys:
    - qpos
    - qvel
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200

train:
  lr: 1.0e-5
  num_epochs: 200
  batch_size: 4
  seed: 0
  device: cuda
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
  pin_memory: true
  split_seed: 0
  train_split_ratio: 0.8
  reuse_split: true
  val_every: 5
  save_latest_every: 10
  checkpoint_every: 50
  plot_every: 50
  amp: true
  amp_dtype: auto
  ckpt_dir: runs/ckpts/yulong_farmstick_3cycle_replay20_workskill_qvel
