# Single-rollout YuLong V2.2 pro full-task 5-dig GC-ACT smoke.
#
# Uses the short-horizon GC-ACT checkpoint trained from the 13 pro full-task
# episodes cropped at the 5th successful dump. This is the first live sanity
# check for the full-task policy, so video/HDF5 are disabled and JSONL rollout
# logs are streamed for post-run QC.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"
  equipment_model: "yulong"
  episode_len: 7000
  scenario_id: "s0_truck"
  camera_names:
    - fpv

eval:
  num_rollouts: 1
  save_video: false
  results_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_v2_2_pro_full_task_5dig_gcact_smoke/results"
  video_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_v2_2_pro_full_task_5dig_gcact_smoke/videos"
  save_rollout_logs: true
  stream_rollout_logs: true
  rollout_log_dir: "/data/pingfan/excavator_testbed_runs/eval/yulong_v2_2_pro_full_task_5dig_gcact_smoke/results/rollouts"
  step_log_interval: 100
  target_cycle_gate: 5
  target_cycle_gate_terminal_hold_steps: 25
  temporal_agg: false
  ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_v2_2_pro_full_task_5dig_gcact_20260515/policy_best.ckpt"
  ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/yulong_v2_2_pro_full_task_5dig_gcact_20260515"
  live_goal_sequence:
    - mid
    - right
    - left
    - right
    - mid
  live_goal_depth_norm: 1.0
  live_goal_dump_target_norm: 1.0
  record_hdf5: false

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 100.0
  hold_steps: 25
  residual_bucket_mass_thresh: 100.0
  strict_max_failures:
    hard_target_collision: 0
    spill_before_target: 0

reward:
  qualified_dig_start_mode: "contact_depth"
  load_mass_threshold_kg: 55.0
  target_approach_distance_m: 1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m: 0.20
  unsafe_distance_penalty: 0.25
  hard_collision_penalty: 0.75
  spill_penalty: 0.25

policy:
  class: "ACT"
  device: "cuda"
  low_dim_keys:
    - qpos
    - qvel
    - goal_tokens
  action_dim: 4
  act_params:
    chunk_size: 100
    kl_weight: 10.0
    hidden_dim: 512
    dim_feedforward: 3200
