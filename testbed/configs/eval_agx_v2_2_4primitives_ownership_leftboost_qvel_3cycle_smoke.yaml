# V2.2 four-primitive ownership-boundary live smoke.

agx:
  host: "127.0.0.1"
  port: 5057
  timeout: 10.0

task:
  name: "agx_excavation_teleop"
  episode_len: 8000
  scenario_id: "s0_truck"

eval:
  num_rollouts: 1
  save_video: true
  video_dir: "runs/eval/agx_v2_2_4primitives_ownership_leftboost_260427_smoke/videos"
  results_dir: "runs/eval/agx_v2_2_4primitives_ownership_leftboost_260427_smoke/results"
  save_rollout_logs: true
  stream_rollout_logs: true
  rollout_log_dir: "runs/eval/agx_v2_2_4primitives_ownership_leftboost_260427_smoke/results/rollouts"
  step_log_interval: 100
  target_cycle_gate: 3
  target_cycle_gate_terminal_hold_steps: 25
  temporal_agg: true

success:
  mode: "dump_complete_final_hold"
  signal_name: "deposited_mass_in_target_box_kg"
  mass_thresh: 300.0
  hold_steps: 25
  residual_bucket_mass_thresh: 100.0
  strict_max_failures:
    hard_target_collision: 0
    spill_before_target: 0

reward:
  load_mass_threshold_kg: 100.0
  target_approach_distance_m: 1.25
  deposit_started_threshold_kg: 10.0
  dig_area_touch_tolerance_m: 0.05
  dig_below_plane_depth_tolerance_m: 0.02
  unsafe_distance_m: 0.20
  unsafe_distance_penalty: 0.25
  hard_collision_penalty: 0.75
  spill_penalty: 0.25

policy:
  class: "primitive_planner_act"
  device: "cuda"
  temporal_agg: true
  primitive_low_dim_keys: ["qpos", "qvel"]
  act_params:
    chunk_size: 100
    kl_weight: 10
    hidden_dim: 512
    dim_feedforward: 3200

  # Initial reset-to-first-loaded compatibility layer. This is not used as a
  # fallback during primitive execution.
  bootstrap_ckpt_path: "runs/ckpts/agx_excavation_act_v1/policy_best.ckpt"
  bootstrap_ckpt_dir: "runs/ckpts/agx_excavation_act_v1"
  bootstrap_low_dim_keys: ["qpos"]
  bootstrap_end_mode: "loaded_and_clear"
  bootstrap_end_min_bucket_mass_kg: 300.0
  bootstrap_end_min_distance_to_dig_area_m: 0.25

  dig_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/dig_qvel_e500_260426/policy_best.ckpt"
  dig_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/dig_qvel_e500_260426"
  carry_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/carry_qvel_ownership_history_probe_leftboost_e500_260427/policy_best.ckpt"
  carry_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/carry_qvel_ownership_history_probe_leftboost_e500_260427"
  dump_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/dump_qvel_ownership_history_probe_leftboost_e500_260427/policy_best.ckpt"
  dump_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/dump_qvel_ownership_history_probe_leftboost_e500_260427"
  return_ckpt_path: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/return_qvel_e500_260426/policy_best.ckpt"
  return_ckpt_dir: "/data/pingfan/excavator_testbed_runs/ckpts/v2_2_4primitives/return_qvel_e500_260426"

  switch:
    dig_to_carry_min_bucket_mass_kg: 300.0
    dig_to_carry_min_distance_to_dig_area_m: 0.0
    dump_ready_min_bucket_mass_kg: 150.0
    dump_ready_min_height_above_rim_m: 0.30
    dump_ready_require_over_footprint: false
    dump_ready_require_clearance: false
    dump_ready_position_mode: "bed_relative"
    dump_ready_max_horizontal_distance_m: null
    dump_ready_max_bed_footprint_outside_distance_m: 1.35
    dump_ready_min_bed_relative_x_m: -4.30
    dump_ready_max_bed_relative_x_m: 2.00
    dump_ready_min_bed_relative_z_m: 2.75
    dump_ready_max_bed_relative_z_m: 3.50
    dump_ready_hold_steps: 3
    dump_done_max_bucket_mass_kg: 100.0
    dump_done_min_deposit_delta_kg: 10.0
    dump_done_hold_steps: 30
    dump_done_use_boundary_event: false
    return_max_steps: 420
