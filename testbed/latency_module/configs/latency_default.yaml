# latency_module default configuration
# ──────────────────────────────────────────────────────────────────────────────
# Copy this file and override values for your experiment.
# Pass the path via the latency.config_path field in your teleop YAML.

latency:
  # Master switch — set to true to enable the latency module
  enabled: false

  # Where to write run outputs (relative to repo root or absolute)
  output_dir: "outputs"

  # Run ID override.  Leave empty to auto-generate (run_YYYYMMDD_HHMMSS_<uuid>).
  run_id: ""

  # ── Network injection config (for tc netem experiments) ────────────────────
  # These values are metadata only — they do NOT inject delay themselves.
  # Run `scripts/inject_delay.sh` separately to configure tc netem.
  network:
    delay_inject_ms:  0.0   # injected one-way delay (ms)
    jitter_inject_ms: 0.0   # jitter (ms)
    loss_rate:        0.0   # packet loss rate [0, 1]

  # ── Video stream config snapshot ───────────────────────────────────────────
  # These fields are recorded into every trace event for experiment tagging.
  stream:
    resolution: ""          # e.g. "1920x1080"
    fps:        0.0
    bitrate:    0           # kbps, 0 = unknown / raw_rgb
    codec:      "raw_rgb"   # raw_rgb | h264 | h265

  # ── Analysis settings ──────────────────────────────────────────────────────
  analysis:
    auto_export_on_close: true   # run export_summary when session ends
    plot_group_col: "delay_inject_ms"
