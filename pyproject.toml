[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excavator-testbed"
version = "0.1.0"
description = "Engineering machinery imitation learning testbed — model-agnostic, hot-swappable policies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy>=1.24,<2",
    "torch>=2.0",
    "torchvision>=0.15",
    # Data
    "h5py>=3.9",
    # Config
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # Visualization / video
    "opencv-python>=4.8,<4.12",
    "matplotlib>=3.7",
    # Teleop input
    "pygame>=2.5",
    # Utils
    "einops>=0.7",
    "tqdm>=4.65",
    "pyquaternion>=0.9",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "pytest>=9.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
tb-record         = "testbed.cli.record:main"
tb-record-teleop  = "testbed.cli.record_teleop:main"
tb-replay         = "testbed.cli.replay:main"
tb-replay-diagnostics = "testbed.cli.replay_diagnostics:main"
tb-audit-swing-consistency = "testbed.cli.audit_swing_consistency:main"
tb-dataset-qc     = "testbed.cli.dataset_qc:main"
tb-train          = "testbed.cli.train:main"
tb-eval           = "testbed.cli.eval:main"
tb-dataset-videos = "testbed.cli.dataset_videos:main"
tb-experiment-record = "testbed.cli.experiment_record:main"
tb-label-v2_1     = "testbed.cli.label_v2_1:main"
tb-build-workskill-v2_1 = "testbed.cli.build_workskill_v2_1:main"
tb-build-transition-v2_1 = "testbed.cli.build_transition_v2_1:main"
tb-build-cell-entry-v2_2 = "testbed.cli.build_cell_entry_v2_2:main"
tb-build-operator-first-v2_2 = "testbed.cli.build_operator_first_v2_2:main"
tb-build-hindsight-goal-v2_4 = "testbed.cli.build_hindsight_goal_v2_4:main"
tb-build-dig-depth-profile-tokens-v1 = "testbed.cli.build_dig_depth_profile_tokens_v1:main"
tb-build-primitives-v2_2 = "testbed.cli.build_primitives_v2_2:main"
tb-build-primitives-v2_2_5p = "testbed.cli.build_primitives_v2_2_5p:main"
tb-audit-target-geometry = "testbed.cli.audit_target_geometry:main"
tb-audit-primitive-boundaries = "testbed.cli.audit_primitive_boundaries:main"
tb-audit-return-windows = "testbed.cli.audit_return_windows:main"
tb-audit-return-ckpt = "testbed.cli.audit_return_ckpt:main"
tb-audit-dig-ckpt = "testbed.cli.audit_dig_ckpt:main"
tb-audit-dig-depth-semantics = "testbed.cli.audit_dig_depth_semantics:main"
tb-policy-audit-manifest = "testbed.cli.policy_audit_manifest:main"
tb-rollout-review = "testbed.cli.rollout_review:main"
tb-materialize-vds = "testbed.cli.materialize_vds:main"
tb-cleanup-training-artifacts = "testbed.cli.cleanup_training_artifacts:main"
tb-virtualize-images = "testbed.cli.virtualize_images:main"
tb-unity-restart-smoke = "testbed.cli.unity_restart_smoke:main"
tb-build-v2_4-hindsight-pipeline = "testbed.cli.build_v2_4_hindsight_pipeline:main"
tb-planner-evidence = "testbed.cli.planner_evidence:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testbed*"]

# ─── black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py310"]

# ─── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88

# ─── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]   # line length handled by black

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false              # start relaxed; tighten per module over time
