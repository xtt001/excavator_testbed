repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: planner-doc-inventory-guard
        name: Validate curated planner documentation inventory
        entry: python3 scripts/planner_architecture_doc_guard.py --check-changed-docs
        language: system
        files: ^docs/
      - id: planner-architecture-doc-contract
        name: Validate planner architecture documentation contract
        entry: python3 scripts/planner_architecture_doc_guard.py --check-architecture-contract --check-doc-inventory
        language: system
        pass_filenames: false
        files: ^(docs/|scripts/planner_architecture_doc_guard\.py)$
