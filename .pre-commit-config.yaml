repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: planner-refactor-history-guard
        name: Prevent extending closed planner refactor history
        entry: python scripts/planner_refactor_guard.py --check-historical-files
        language: system
        files: ^docs/(primitive_scheduler_service_refactor_plan\.md|primitive_scheduler_service_refactor_plan_DO_NOT_EXTEND_HISTORY\.md)$
      - id: planner-refactor-plan-contract
        name: Validate planner rollout-evidence plan contract
        entry: python scripts/planner_refactor_guard.py --check-plan-contract
        language: system
        pass_filenames: false
        files: ^(docs/planner_rollout_evidence_refactor_plan\.md|docs/planner_rollout_evidence_refactor_log\.md|docs/primitive_scheduler_service_refactor_plan_DO_NOT_EXTEND_HISTORY\.md|scripts/planner_refactor_guard\.py)$
      - id: planner-refactor-skill-contract
        name: Validate excavator planner refactor skill contract
        entry: python scripts/planner_refactor_guard.py --check-skill-contract
        language: system
        pass_filenames: false
        files: ^(scripts/planner_refactor_guard\.py|docs/planner_rollout_evidence_refactor_plan\.md|docs/planner_rollout_evidence_refactor_log\.md)$
